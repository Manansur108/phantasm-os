<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phantasm-OS 95 - Generative Desktop Simulation</title>
  <link rel="stylesheet" href="/static/css/win95.css">
  <link rel="stylesheet" href="/static/css/crt.css">
  <link rel="stylesheet" href="/static/css/apps.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='2' width='12' height='12' fill='%23000080'/><text x='3' y='12' fill='%23fff' font-family='monospace' font-size='10'>95</text></svg>">
</head>
<body class="crt-mode">
  <!-- CRT Post-Processing Shader Overlay -->
  <div id="crt-screen">
    <div class="scanline-beam"></div>
  </div>

  <!-- Main Desktop Surface -->
  <div id="desktop">
    <!-- Desktop Icons -->
    <div class="desktop-icons">
      <!-- My Computer -->
      <div class="desktop-icon" id="icon-my-computer" title="My Computer">
        <svg viewBox="0 0 32 32">
          <rect x="5" y="4" width="22" height="17" fill="#dfdfdf" stroke="#000" stroke-width="1.5"/>
          <rect x="7" y="6" width="18" height="13" fill="#000080"/>
          <rect x="11" y="21" width="10" height="4" fill="#808080" stroke="#000" stroke-width="1.5"/>
          <rect x="4" y="25" width="24" height="3" fill="#c0c0c0" stroke="#000" stroke-width="1.5"/>
        </svg>
        <span>My Computer</span>
      </div>

      <!-- Phantasm Navigator -->
      <div class="desktop-icon" id="icon-navigator" title="Phantasm Navigator 2.0">
        <svg viewBox="0 0 32 32">
          <circle cx="16" cy="16" r="13" fill="#000080" stroke="#000" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="10" fill="none" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="3" y1="16" x2="29" y2="16" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="16" y1="3" x2="16" y2="29" stroke="#00ffcc" stroke-width="1.5"/>
          <polygon points="16,6 20,16 16,13 12,16" fill="#ffcc00"/>
        </svg>
        <span>Phantasm Navigator</span>
      </div>

      <!-- CyberMail 95 -->
      <div class="desktop-icon" id="icon-mail" title="CyberMail 95">
        <svg viewBox="0 0 32 32">
          <rect x="4" y="7" width="24" height="18" fill="#ffffcc" stroke="#000" stroke-width="1.5"/>
          <polyline points="4,7 16,18 28,7" fill="none" stroke="#000" stroke-width="1.5"/>
          <polygon points="16,18 4,7 28,7" fill="#ffff99" opacity="0.6"/>
        </svg>
        <span>CyberMail 95</span>
      </div>

      <!-- Phantasm DOS Prompt -->
      <div class="desktop-icon" id="icon-dos" title="Phantasm DOS Prompt">
        <svg viewBox="0 0 32 32">
          <rect x="3" y="5" width="26" height="22" fill="#000000" stroke="#808080" stroke-width="1.5"/>
          <text x="6" y="17" fill="#00ff00" font-family="monospace" font-size="11" font-weight="bold">C:\&gt;</text>
        </svg>
        <span>Phantasm DOS</span>
      </div>

      <!-- Notepad -->
      <div class="desktop-icon" id="icon-notepad" title="Notepad">
        <svg viewBox="0 0 32 32">
          <rect x="6" y="3" width="20" height="26" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
          <line x1="9" y1="8" x2="23" y2="8" stroke="#000080" stroke-width="1.5"/>
          <line x1="9" y1="13" x2="23" y2="13" stroke="#808080" stroke-width="1.5"/>
          <line x1="9" y1="18" x2="23" y2="18" stroke="#808080" stroke-width="1.5"/>
          <line x1="9" y1="23" x2="18" y2="23" stroke="#808080" stroke-width="1.5"/>
        </svg>
        <span>Notepad</span>
      </div>

      <!-- Sector 7G ARG Station -->
      <div class="desktop-icon" id="icon-arg" title="Sector 7G Investigation Hub">
        <svg viewBox="0 0 32 32">
          <rect x="3" y="3" width="26" height="26" fill="#0c0f12" stroke="#00ffcc" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="8" fill="none" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="16" y1="4" x2="16" y2="28" stroke="#00ffcc" stroke-width="1.5"/>
          <line x1="4" y1="16" x2="28" y2="16" stroke="#00ffcc" stroke-width="1.5"/>
          <text x="12" y="19" fill="#ff3333" font-family="monospace" font-size="9" font-weight="bold">7G</text>
        </svg>
        <span>Sector 7G Hub</span>
      </div>
    </div>

    <!-- Existential Clippy Assistant Mount -->
    <div id="clippy-container"></div>
  </div>

  <!-- Start Menu Popup -->
  <div id="start-menu" class="bevel-outset">
    <div class="start-menu-banner">
      PHANTASM 95
    </div>
    <div class="start-menu-items">
      <div class="start-menu-item" id="sm-nav">
        🌐 <span>Phantasm Navigator</span>
      </div>
      <div class="start-menu-item" id="sm-mail">
        ✉ <span>CyberMail 95</span>
      </div>
      <div class="start-menu-item" id="sm-dos">
        ⬛ <span>Phantasm DOS</span>
      </div>
      <div class="start-menu-item" id="sm-notepad">
        📝 <span>Notepad Editor</span>
      </div>
      <div class="start-menu-item" id="sm-arg">
        🕵 <span>Sector 7G Mystery</span>
      </div>
      <div class="start-divider"></div>
      <div class="start-menu-item" id="sm-clippy">
        📎 <span>Toggle Clippy</span>
      </div>
      <div class="start-divider"></div>
      <div class="start-menu-item" id="sm-restart">
        🔄 <span>Reboot Simulation...</span>
      </div>
    </div>
  </div>

  <!-- Windows 95 Bottom Taskbar -->
  <div id="taskbar">
    <div class="taskbar-left">
      <button class="bevel-button" id="start-button">
        <svg viewBox="0 0 16 16" width="14" height="14" style="margin-right:2px;">
          <rect x="1" y="1" width="6" height="6" fill="#f25022"/>
          <rect x="9" y="1" width="6" height="6" fill="#7fba00"/>
          <rect x="1" y="9" width="6" height="6" fill="#00a4ef"/>
          <rect x="9" y="9" width="6" height="6" fill="#ffb900"/>
        </svg>
        <span>Start</span>
      </button>
      <div id="task-items"></div>
    </div>

    <div class="taskbar-right">
      <button class="bevel-button" id="toggle-crt" style="font-size:10px; padding:1px 5px;" title="Toggle CRT Scanline Shader">
        📺 CRT: ON
      </button>
      <button class="bevel-button" id="toggle-sound" style="font-size:10px; padding:1px 5px;" title="Toggle Web Audio Synthesizer">
        🔊 Audio: ON
      </button>
      <div id="system-tray">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="#000000">
          <polygon points="1,5 5,5 9,1 9,15 5,11 1,11"/>
          <path d="M11,4 C13,6 13,10 11,12" stroke="#000" fill="none"/>
        </svg>
        <span id="tray-clock">12:00 PM</span>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/static/js/audio.js"></script>
  <script src="/static/js/wm.js"></script>
  <script src="/static/js/vfs_client.js"></script>
  <script src="/static/js/clippy.js"></script>
  <script src="/static/js/navigator.js"></script>
  <script src="/static/js/mail.js"></script>
  <script src="/static/js/dos.js"></script>
  <script src="/static/js/notepad.js"></script>
  <script src="/static/js/arg_hub.js"></script>
  <script src="/static/js/os.js"></script>
</body>
</html>
